name: Template

on:
  push:
  pull_request:

concurrency:
  group: template-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate project
        run: |
          python create_project.py \
            --name sample-app \
            --path "${{ runner.temp }}/sample-app" \
            --author "Template CI" \
            --email "ci@example.com" \
            --vps-host 203.0.113.10 \
            --no-git-init

      - name: Backend checks
        working-directory: ${{ runner.temp }}/sample-app
        run: |
          uv sync --extra dev
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest

      - name: Frontend checks
        working-directory: ${{ runner.temp }}/sample-app/frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-template-${{ runner.os }}-${{ hashFiles('template/frontend/package-lock.json') }}

      - name: Playwright
        working-directory: ${{ runner.temp }}/sample-app/frontend
        run: |
          npx playwright install --with-deps --only-shell chromium
          npm run test:e2e

  without-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate project without database
        run: |
          python create_project.py \
            --name sample-nodb \
            --path "${{ runner.temp }}/sample-nodb" \
            --author "Template CI" \
            --email "ci@example.com" \
            --vps-host 203.0.113.10 \
            --database none \
            --no-git-init

      - name: Backend checks
        working-directory: ${{ runner.temp }}/sample-nodb
        run: |
          uv sync --extra dev
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest

      - name: Frontend checks
        working-directory: ${{ runner.temp }}/sample-nodb/frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
