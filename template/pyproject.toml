[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "[[ project_name ]]"
requires-python = ">=3.11"
authors = [{ name = "[[ author ]]", email = "[[ author_email ]]" }]
description = "Flask backend with a React frontend"
readme = "README.md"
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = ["version"]
dependencies = [
  "flask>=3.1",
  "flask-restx>=1.3",
  "python-dotenv>=1.0",
[[#if database]]
  "flask-sqlalchemy>=3.1",
[[/endif]]
  # Gunicorn is Unix-only; Windows uses the Flask dev server.
  "gunicorn>=23; sys_platform != 'win32'",
]

[project.urls]
Repository = "[[ repo_url ]]"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
include = ["project*"]

[tool.setuptools.dynamic]
version = { attr = "project._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["project"]

[tool.coverage.run]
source = ["project"]

[tool.coverage.report]
show_missing = true
skip_covered = true
